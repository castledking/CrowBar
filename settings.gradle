pluginManagement {
    plugins {
        // NeoForge subprojects use ModDevGradle.
        id "net.neoforged.moddev" version "2.0.144"
    }
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://libraries.minecraft.net/" }
        mavenCentral()
    }
}

rootProject.name = "CrowBar"
include "common"
include "version21:neoforge"
  include "version21_6:fabric", "version21_6:neoforge", "version21_9:fabric", "version21_9:neoforge"
include "version26_1:fabric", "version26_1:neoforge"
include "version26_2:fabric", "version26_2:neoforge"
include "version26_3:fabric", "version26_3:neoforge"
