modLoader="javafml"
loaderVersion="[4,)"
license="GNU Lesser General Public License v3.0"
issueTrackerURL="https://github.com/castledking/CrowBar/issues"

[[mods]]
modId="crowbar"
version="${mod_version}"
displayName="CrowBar"
authors="castledking"
description='''Client locator bar name tags, skin markers, and self-view rendering.'''
logoFile="assets/crowbar/icon.png"
displayTest="IGNORE_SERVER_VERSION"

[[mixins]]
config="crowbar.client.mixins.json"

[[dependencies.crowbar]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_dependency}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.crowbar]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_dependency}"
    ordering="NONE"
    side="CLIENT"
