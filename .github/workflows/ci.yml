name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Builds every Fabric and NeoForge jar and runs the common module tests, which also check
      # that every jar's language file matches.
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crowbar-artifacts
          path: |
            version*/*/build/libs/CrowBar-*.jar
            bukkit/build/libs/CrowBar-plugin-*.jar
            !version*/*/build/libs/*-sources.jar
