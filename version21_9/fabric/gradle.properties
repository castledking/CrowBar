yarn_mappings=1.21.11+build.4
loader_version=0.18.4
fabric_api_version=0.141.4+1.21.11
fabric_api_minimum=0.134.0
modmenu_version=17.0.0-beta.2
archives_base_name=CrowBar-1.21.x
