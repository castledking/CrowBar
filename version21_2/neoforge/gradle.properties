# Before 1.21.6 there is no locator bar, so this jar draws its markers over the experience bar.
# Compiled against 1.21.5. NeoForge never shipped a stable 1.21.2 release, so the range starts at
# 1.21.3; every Minecraft and NeoForge method this jar calls exists unchanged from there to 1.21.5.
neoforge_version=21.5.101
archives_base_name=CrowBar-1.21.3-1.21.5-neoforge
neoforge_dependency=[21.3.0,21.6.0)
minecraft_dependency=[1.21.3,1.21.6)
